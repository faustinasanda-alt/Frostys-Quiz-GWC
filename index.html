<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="/style.css">

	<!-- import the webpage's javascript file -->
	<script src="/script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Are You A Deodorant Person Or Lotion Person Based On Your Hyigene Products?</h1>
		<p>Click What Option You Like Better To Get Your Result</p>
	</header>

	<main>

		<h2>Choose A Nail Product:</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="nailclippers.jpg" alt="up close view of small scissors that coukld be used as nail clippers">
        <br>
        <button id="q1a1">Nail clippers</button>
      </div>

      <div class="answer-choice">
        <img src="nailpolish.jpg" alt=" line a four nail polishes, a red one, a pink one, a light blue one, and a darker blue one, each have the lid off and laid in front of it.">
        <br>
        <button id="q1a2">Nail polish</button>
      </div>

    </div> 
    
    <h2>Now, Choose A Mouth Product:</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="toothpaste.jpg" alt="Animated picture of toothpaste on hardwood ground with cap open and toothpaste squirting out">
        <br>
        <button id="q2a1">Toothpaste</button>
      </div>

      <div class="answer-choice">
        <img src="mouthwash.jpg" alt="two small bottles of blue mouth wash next to each other in line">
        <br>
        <button id="q2a2">Mouth wash</button>
      </div>

    </div> 
    
    <h2>Finally, Choose A Hair Product:</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="shampoo.jpg" alt=" hands in a mans hair scrubbing soapy shampoo">
        <br>
        <button id="q3a1">Shampoo</button>
      </div>

      <div class="answer-choice">
        <img src="conditioner.jpg" alt="close up view of women squirting hair conditioner on hand.">
        <br>
        <button id="q3a2">Conditioner</button>
      </div>

    </div> 
    
    <h2 id="result">You Are A...</h2>
    
    <button id="restart">Restart</button>
  </main>
  </body>
</html>
